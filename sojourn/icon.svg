<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="planet" cx="0.4" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#f08d50"/>
      <stop offset="0.5" stop-color="#c8502a"/>
      <stop offset="1" stop-color="#7a2512"/>
    </radialGradient>
  </defs>
  <!-- space -->
  <rect width="64" height="64" rx="12" fill="#13112a"/>
  <g fill="#ffffff">
    <circle cx="9" cy="10" r="1.1"/>
    <circle cx="22" cy="6" r="0.7" opacity="0.8"/>
    <circle cx="53" cy="9" r="1.2"/>
    <circle cx="58" cy="24" r="0.7" opacity="0.7"/>
    <circle cx="6" cy="26" r="0.7" opacity="0.7"/>
    <circle cx="44" cy="4" r="0.6" opacity="0.6"/>
  </g>
  <!-- the red planet: a curved horizon filling the bottom of the tile -->
