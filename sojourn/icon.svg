    <line x1="40" y1="30" x2="40" y2="18" stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="35.5" y="14" width="10" height="5.5" rx="1.6" fill="#f2f2f2"/>
    <circle cx="43.3" cy="16.7" r="1.2" fill="#13112a"/>
    <line x1="22" y1="30" x2="20" y2="22" stroke="#f2f2f2" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="16" y="27.5" width="32" height="7" rx="2" fill="#f2f2f2"/>
    <rect x="16" y="27.5" width="32" height="2.2" rx="1" fill="#35d0ff"/>
    <g fill="#262626" stroke="#f2f2f2" stroke-width="1.4">
      <circle cx="20" cy="39" r="4.3"/>
      <circle cx="32" cy="39" r="4.3"/>
      <circle cx="44" cy="39" r="4.3"/>
